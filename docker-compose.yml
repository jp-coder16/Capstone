version: "3.8"

services:

  ml:
    build: ./ml-service
    container_name: ml
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - ml
    environment:
      - ML_URL=http://ml:8000

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend