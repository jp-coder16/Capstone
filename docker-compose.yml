version: "3.8"

services:

  # =========================
  # 🔥 ML SERVICE
  # =========================
 
  # =========================
  # 🚀 BACKEND SERVICE
  # =========================
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      ml:
        condition: service_healthy   # ✅ waits for ML properly
    environment:
      - ML_URL=http://ml:8000        # ✅ internal Docker networking
    restart: unless-stopped

  # =========================
  # 🌐 FRONTEND SERVICE
  # =========================
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped